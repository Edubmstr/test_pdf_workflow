# .github/workflows/convert-to-pdf.yml
name: Docs to PDF

on:
  push:
    branches:
      - "docs/**"
    paths:
      - 'docs/**.md'
      - 'docs/images/**'

jobs:
  converttopdf:
    name: Build PDF and commit to repo
    runs-on: ubuntu-latest

    permissions:
      contents: write  # erlaubt Commit ins Repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PDFs from Markdown (baseline action)
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: docs
          output_dir: pdfs/           # 👈 WICHTIG: Slash am Ende!
          images_dir: docs/images
          image_import: ./images
          build_html: false

      - name: Normalize PDF output location
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pdfs
          shopt -s nullglob
          # Falls die Action PDFs fälschlich im Repo-Root erzeugt hat, rüber nach pdfs/
          for f in *.pdf; do
            echo "Verschiebe $f -> pdfs/"
            mv "$f" pdfs/
          done
          # Optional: doppelte Dateien bereinigen (gleicher Name)
          # for f in pdfs/*.pdf; do
          #   [ -f "$f" ] || continue
          #   echo "PDF vorhanden: $f"
          # done
          ls -la pdfs || true

      - name: Commit and push generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "Aktueller Branch: $BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A pdfs/

          git commit -m "Auto-build: update PDFs in /pdfs [skip ci]"
          git push origin HEAD:$BRANCH_NAME
