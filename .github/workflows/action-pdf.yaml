name: Docs to PDF

on:
  push:
    branches:
      - "docs/**" 
    paths:
      - 'docs/**.md'
      - 'docs/images/**'

jobs:
  converttopdf:
    name: Build PDF (Baseline + Pretty)
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Baseline: simple conversion using baileyjm02/markdown-to-pdf
      # ----------------------------------------------------------
      - name: Build (Baseline - markdown-to-pdf)
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_dir: docs
          output_dir: pdfs
          images_dir: docs/images
          image_import: ./images
