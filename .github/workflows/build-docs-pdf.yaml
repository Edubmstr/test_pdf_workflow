name: Build docs.pdf from Markdown

on:
  push:
    branches:
      - "docs/**"   # Trigger nur bei Branches, die mit docs/ beginnen

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # erlaubt Commit zurück ins Repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # vollständige Historie für Commit

      - name: Install pandoc & wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Build docs.pdf from Markdown files in docs/
        shell: bash
        run: |
          set -euo pipefail

          # Alle Markdown-Dateien im docs/-Ordner sammeln (rekursiv)
          mapfile -t MD_FILES < <(find docs -type f -name "*.md" | sort)

          if [ ${#MD_FILES[@]} -eq 0 ]; then
            echo "Keine Markdown-Dateien in ./docs gefunden. Beende."
            exit 0
          fi

          echo "Erzeuge docs.pdf aus folgenden Dateien:"
          printf ' - %s\n' "${MD_FILES[@]}"

          pandoc \
            -s \
            --toc \
            -V margin=1in \
            --pdf-engine=wkhtmltopdf \
            "${MD_FILES[@]}" \
            -o docs.pdf

      - name: Commit and push docs.pdf to same branch
        shell: bash
        run: |
          # Aktuellen Branch bestimmen
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          echo "Aktueller Branch: $BRANCH_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs.pdf
          git commit -m "Auto-build: update docs.pdf [skip ci]"
          git push origin HEAD:$BRANCH_NAME

      - name: Upload PDF artifact (optional backup)
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: docs.pdf
          if-no-files-found: error
